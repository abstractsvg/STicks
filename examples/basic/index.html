<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STicks example</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button type="button" id="back" title="Back">&larr;</button>
      <button type="button" id="forward" title="Forward">&rarr;</button>
      <button type="button" id="reload" title="Reload">&#x21bb;</button>
      <form id="address-form">
        <input id="address" placeholder="Search or type a URL" autocomplete="off" spellcheck="false" />
      </form>
      <div id="extensions" class="extensions" aria-label="Extensions"></div>
      <button type="button" id="open-manager" title="Manage extensions">Extensions</button>
    </header>

    <nav class="tabs">
      <ul id="tab-list"></ul>
      <button type="button" id="new-tab" title="New tab">+</button>
    </nav>

    <main id="pages"></main>

    <div id="popup" class="popup" hidden></div>

    <dialog id="manager">
      <h2>Extensions</h2>
      <form id="install-store">
        <input name="source" placeholder="Chrome Web Store link or extension ID" autocomplete="off" spellcheck="false" />
        <button type="submit">Install</button>
      </form>
      <label class="file">Load a .crx or .zip <input type="file" id="install-file" accept=".crx,.zip" /></label>
      <p id="install-status" role="status"></p>
      <ul id="installed"></ul>
      <p class="stats" id="rule-stats"></p>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
